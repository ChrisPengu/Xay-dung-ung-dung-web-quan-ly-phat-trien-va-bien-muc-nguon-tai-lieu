<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(pageTitle, activeMenu, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Hệ thống quản lý phát triển và biên mục nguồn tài liệu">
    <title th:text="${pageTitle + ' · ' + appName}">DocuCatalog</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/1.13.1/font/bootstrap-icons.min.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<a class="skip-link" href="#main-content">Chuyển đến nội dung chính</a>
<div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Điều hướng chính">
        <div class="brand">
            <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
            <span><strong>DocuCatalog</strong><small>Thư viện số</small></span>
        </div>
        <nav class="main-nav">
            <p class="nav-label">Không gian làm việc</p>
            <a th:href="@{/dashboard}" th:classappend="${activeMenu == 'dashboard'} ? ' active'">
                <i class="nav-icon bi bi-grid-1x2" aria-hidden="true"></i><span>Tổng quan</span>
            </a>
            <a th:href="@{/documents}" th:classappend="${activeMenu == 'documents'} ? ' active'">
                <i class="nav-icon bi bi-journal-text" aria-hidden="true"></i><span>Biên mục tài liệu</span>
            </a>
            <a th:href="@{/acquisitions}" th:classappend="${activeMenu == 'acquisitions'} ? ' active'">
                <i class="nav-icon bi bi-box-seam" aria-hidden="true"></i><span>Phát triển nguồn</span>
            </a>
            <a th:href="@{/references}" th:classappend="${activeMenu == 'references'} ? ' active'">
                <i class="nav-icon bi bi-database" aria-hidden="true"></i><span>Dữ liệu danh mục</span>
            </a>
            <a th:if="${isAdmin}" th:href="@{/users}" th:classappend="${activeMenu == 'users'} ? ' active'">
                <i class="nav-icon bi bi-people" aria-hidden="true"></i><span>Người dùng</span>
            </a>
        </nav>
        <div class="sidebar-footer">
            <div class="user-card">
                <span class="avatar" th:text="${#strings.substring(currentUser.fullName, 0, 1)}">A</span>
                <span class="user-meta">
                    <strong th:text="${currentUser.fullName}">Người dùng</strong>
                    <small th:text="${currentUser.roleLabel}">Vai trò</small>
                </span>
            </div>
            <a class="logout-button" th:href="@{/account/password}"><i class="bi bi-shield-lock" aria-hidden="true"></i> Đổi mật khẩu</a>
            <form th:action="@{/logout}" method="post">
                <button class="logout-button" type="submit"><i class="bi bi-box-arrow-right" aria-hidden="true"></i> Đăng xuất</button>
            </form>
        </div>
    </aside>
    <button class="sidebar-overlay" id="sidebar-overlay" type="button" aria-label="Đóng menu"></button>

    <div class="main-area">
        <header class="topbar">
            <button class="menu-toggle" id="menu-toggle" type="button" aria-controls="sidebar" aria-expanded="false" aria-label="Mở menu"><i class="bi bi-list" aria-hidden="true"></i></button>
            <div class="topbar-context"><span>Hệ thống thư viện</span><strong th:text="${pageTitle}">Trang</strong></div>
            <div class="topbar-user">
                <span class="status-dot" aria-hidden="true"></span>
                <span th:text="${currentUser.fullName}">Người dùng</span>
            </div>
        </header>

        <main id="main-content" class="page-content">
            <div class="toast toast-success" th:if="${success}" role="status">
                <i class="toast-icon bi bi-check-circle-fill" aria-hidden="true"></i><span th:text="${success}">Thành công</span>
                <button type="button" data-dismiss-toast aria-label="Đóng"><i class="bi bi-x-lg" aria-hidden="true"></i></button>
            </div>
            <div class="toast toast-error" th:if="${error}" role="alert">
                <i class="toast-icon bi bi-exclamation-circle-fill" aria-hidden="true"></i><span th:text="${error}">Có lỗi</span>
                <button type="button" data-dismiss-toast aria-label="Đóng"><i class="bi bi-x-lg" aria-hidden="true"></i></button>
            </div>
            <th:block th:replace="${content}"/>
        </main>
        <footer class="app-footer"><span>DocuCatalog · Quản lý nguồn tài liệu</span><span>Spring Boot &amp; Thymeleaf</span></footer>
    </div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
