<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout('Tài khoản và phân quyền', 'users', ~{::main})}">
<main>
    <header class="page-heading">
        <div><span class="eyebrow">Đồng đội trong hệ thống</span><h1>Tài khoản và phân quyền</h1><p>Theo dõi ai đang dùng DocuCatalog và duyệt những yêu cầu mới gửi đến.</p></div>
        <div class="heading-actions"><a class="button button-primary" th:href="@{/users/new}"><i class="bi bi-person-plus" aria-hidden="true"></i> Thêm tài khoản</a></div>
    </header>

    <section class="card">
        <header class="card-header"><div><h2>Mọi tài khoản</h2><p th:text="${users.size() + ' tài khoản'}">0 tài khoản</p></div></header>
        <div class="table-wrap">
            <table>
                <thead><tr><th>Người dùng</th><th>Tên đăng nhập</th><th>Vai trò</th><th>Trạng thái</th><th><span class="sr-only">Thao tác</span></th></tr></thead>
                <tbody><tr th:each="user : ${users}">
                    <td><div class="user-list-identity"><span class="avatar" th:classappend="${' avatar-' + #strings.toLowerCase(user.avatarTheme)}"><img th:if="${user.avatarFileName != null}" th:src="@{/media/avatars/{file}(file=${user.avatarFileName})}" alt=""><span th:unless="${user.avatarFileName != null}" th:text="${#strings.substring(user.fullName, 0, 1)}">A</span></span><span><span class="cell-title" th:text="${user.fullName}">Họ tên</span><span class="cell-subtitle" th:text="${user.department != null ? user.department : (user.email != null ? user.email : 'Chưa bổ sung thông tin')}">Đơn vị</span></span></div></td>
                    <td><span class="code" th:text="${user.username}">username</span><span class="cell-subtitle" th:if="${user.id == currentUser.id}">Tài khoản của bạn</span></td>
                    <td th:text="${user.role.label}">Vai trò</td>
                    <td><span class="badge" th:classappend="${!user.approved ? ' badge-warning' : (user.active ? ' badge-success' : ' badge-neutral')}" th:text="${!user.approved ? 'Chờ duyệt' : (user.active ? 'Đang dùng' : 'Tạm khóa')}">Trạng thái</span></td>
                    <td><div class="cell-actions">
                        <a class="button button-sm" th:href="@{/users/{id}/edit(id=${user.id})}"><i class="bi bi-pencil" aria-hidden="true"></i> Sửa</a>
                        <form th:if="${user.id != currentUser.id}" th:action="@{/users/{id}/active(id=${user.id})}" method="post" th:attr="data-confirm=${!user.approved ? 'Duyệt và cho phép tài khoản này đăng nhập?' : (user.active ? 'Tạm khóa tài khoản này?' : 'Cho phép tài khoản này đăng nhập lại?')}">
                            <input type="hidden" name="active" th:value="${!user.active}">
                            <button class="button button-sm" th:classappend="${user.active ? ' button-danger' : ' button-primary'}" type="submit"><i class="bi" th:classappend="${user.active ? ' bi-person-x' : ' bi-person-check'}" aria-hidden="true"></i> <span th:text="${!user.approved ? 'Duyệt tài khoản' : (user.active ? 'Tạm khóa' : 'Mở lại')}">Đổi trạng thái</span></button>
                        </form>
                    </div></td>
                </tr></tbody>
            </table>
        </div>
    </section>
</main>
</html>
