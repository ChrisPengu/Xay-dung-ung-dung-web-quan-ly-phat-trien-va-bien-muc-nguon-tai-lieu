<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout('Đổi mật khẩu', '', ~{::main})}">
<main>
    <header class="page-heading">
        <div><span class="eyebrow">Bảo mật tài khoản</span><h1>Đổi mật khẩu</h1><p>Sau khi đổi mật khẩu, hệ thống sẽ đăng xuất để xác thực lại thông tin mới.</p></div>
        <div class="heading-actions"><a class="button" th:href="@{/dashboard}"><i class="bi bi-arrow-left" aria-hidden="true"></i> Tổng quan</a></div>
    </header>

    <section class="card" style="max-width:720px">
        <header class="card-header"><div><h2>Mật khẩu đăng nhập</h2><p>Sử dụng ít nhất 8 ký tự và không dùng lại mật khẩu hiện tại.</p></div><i class="bi bi-shield-lock" aria-hidden="true"></i></header>
        <form class="card-body" th:object="${passwordForm}" th:action="@{/account/password}" method="post">
            <div class="form-errors" th:if="${#fields.hasGlobalErrors()}" role="alert"><p th:each="err : ${#fields.globalErrors()}" th:text="${err}">Lỗi</p></div>
            <div class="form-grid">
                <div class="field full"><label class="required" for="currentPassword">Mật khẩu hiện tại</label><input class="input" id="currentPassword" type="password" th:field="*{currentPassword}" autocomplete="current-password"><span class="field-error" th:errors="*{currentPassword}">Lỗi</span></div>
                <div class="field"><label class="required" for="newPassword">Mật khẩu mới</label><input class="input" id="newPassword" type="password" th:field="*{newPassword}" autocomplete="new-password"><span class="field-error" th:errors="*{newPassword}">Lỗi</span></div>
                <div class="field"><label class="required" for="confirmPassword">Xác nhận mật khẩu mới</label><input class="input" id="confirmPassword" type="password" th:field="*{confirmPassword}" autocomplete="new-password"><span class="field-error" th:errors="*{confirmPassword}">Lỗi</span></div>
            </div>
            <div class="form-actions"><a class="button" th:href="@{/dashboard}">Hủy</a><button class="button button-primary" type="submit"><i class="bi bi-check-lg" aria-hidden="true"></i> Đổi mật khẩu</button></div>
        </form>
    </section>
</main>
</html>
