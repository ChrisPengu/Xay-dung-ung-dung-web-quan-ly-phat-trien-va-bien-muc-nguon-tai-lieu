spring:
  datasource:
    url: jdbc:h2:mem:docucatalog-demo;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: false
  thymeleaf:
    cache: false

app:
  seed-data: true
  avatar-storage-dir: ./target/demo-uploads/avatars
