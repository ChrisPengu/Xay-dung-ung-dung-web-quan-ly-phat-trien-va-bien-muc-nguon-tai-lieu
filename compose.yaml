services:
  mysql:
    image: mysql:8.4
    container_name: docucatalog-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-docucatalog}
      MYSQL_USER: ${MYSQL_USER:-docucatalog}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-docucatalog}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "3306:3306"
    volumes:
      - docucatalog_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-change-me}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: docucatalog-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-docucatalog}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh
      DB_USERNAME: ${MYSQL_USER:-docucatalog}
      DB_PASSWORD: ${MYSQL_PASSWORD:-docucatalog}
      APP_SEED_DATA: ${APP_SEED_DATA:-true}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "8080:8080"

volumes:
  docucatalog_mysql:
